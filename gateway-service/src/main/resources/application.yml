server:
  port: 8080
spring:
  application:
    name: gateway-service #网关服务名
  cloud:
    # Nacos注册中心配置
    nacos:
      discovery:
        server-addr: 192.168.43.143:8848
        namespace: 1
        group: DEFAULT_GROUP
    # Gateway配置
    gateway:
      server:
        webflux:
          enabled: true
          routes:
            # 路由1：转发用户服务请求
            - id: user-service-route # 路由唯一ID
              uri: lb://user-service # 目标服务名（lb表示负载均衡）
              predicates:
                - Path=/api/user-service/** # 路由断言：匹配路径
            # 路由2：转发购票服务请求
            - id: ticket-service-route # 路由唯一ID
              uri: lb://ticket-service # 目标服务名（lb表示负载均衡）
              predicates:
                - Path=/api/ticket-service/** # 路由断言：匹配路径
            # 路由3：转发订单服务请求
            - id: order-service-route # 路由唯一ID
              uri: lb://order-service # 目标服务名（lb表示负载均衡）
              predicates:
                - Path=/api/order-service/** # 路由断言：匹配路径
# 网关认证相关配置
gateway:
  auth:
    # 免拦截路径列表，根据实际业务调整
    exclude-paths:
      - /api/user-service/v1/login
      - /api/user-service/register
      - /api/ticket-service/ticket/query
      - /api/ticket-service/stations/page
# jwt令牌配置
jwt:
  secret: abcdefghijklmnopqrstuvwxyz1234567890ABCDEFG
  expiration: 720000
