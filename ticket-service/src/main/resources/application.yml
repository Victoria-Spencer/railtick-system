server:
  port: 8083
spring:
  application:
    name: ticket-service
  cloud:
    # nacos注册中心配置
    nacos:
      discovery:
        server-addr: ${spring.nacos.host}:${spring.nacos.port}
        namespace: 1
        group: DEFAULT_GROUP
        graceful-shutdown: false
  profiles:
    active: dev  # 激活生产环境配置
  datasource:
    url: jdbc:mysql://${spring.db.host}/rs-ticket
    username: ${spring.db.username}
    password: ${spring.db.password}
    driver-class-name: com.mysql.cj.jdbc.Driver
  data:
    redis:
      # ========== 单节点核心配置（替换原cluster节点） ==========
      host: 192.168.43.143  # Redis服务器IP
      port: 6379             # Redis端口（默认6379）
      #      password: ""           # Redis密码（无密码则留空/注释，可选）
      database: 0            # 操作的数据库（默认0）
      timeout: PT5S          # 连接/读写超时时间（3.5.5推荐ISO-8601格式）
      client-name: redis-single-client  # 客户端名称
      lettuce:
        pool:
          max-active: 16     # 最大连接数
          max-idle: 8        # 最大空闲连接
          min-idle: 4        # 最小空闲连接
          max-wait: PT2S     # 连接获取超时时间
seata:
  registry: # 注册中心的配置，微服务根据这些信息去注册中心获取TC服务地址
    type: nacos # 注册中心类型 nacos
    nacos:
      server-addr: 192.168.43.143:8848 # nacos地址
      namespace: "1"
      group: DEFAULT_GROUP
      application: seata-server # seata-server服务名称
      username: nacos
      password: nacos
  tx-service-group: rs #事务组名称
  service:
    vgroup-mapping: # 事务组与tc集群的映射关系
      rs: "default" # 事务组映射
  data-source-proxy-mode: AT # 开启数据源代理的AT模式
# MyBatis 配置
mybatis:
  mapper-locations: classpath:mapper/*.xml  # 扫描 resources/mapper 目录下的所有 XML 文件
  configuration:
    map-underscore-to-camel-case: true  # 开启下划线转驼峰
# 站点缓存配置
station:
  cache:
    # 定时任务开关（实例A设为true，其他实例设为false）
    schedule:
      enable: true