server:
  port: 8081

spring:
  datasource:
    url: jdbc:mysql://localhost:3306/railtick_system
    username: root
    password: root
    driver-class-name: com.mysql.cj.jdbc.Driver

# MyBatis 配置
mybatis:
  mapper-locations: classpath:mapper/*.xml  # 扫描 resources/mapper 目录下的所有 XML 文件
  configuration:
    map-underscore-to-camel-case: true  # 开启下划线转驼峰