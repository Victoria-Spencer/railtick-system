server:
  port: 8086
spring:
  application:
    name: log-service
  config:
    import:
      # common-defaults.yml 来自 common 模块 jar 包，IDE 误报忽略即可
      - classpath:common-defaults.yml
  cloud:
    # nacos注册中心配置
    nacos:
      discovery:
        server-addr: ${spring.nacos.host}:${spring.nacos.port}
        namespace: 1
        group: DEFAULT_GROUP
        graceful-shutdown: false
  profiles:
    active: dev  # 激活生产环境配置
  datasource:
    url: jdbc:mysql://${spring.db.host}/rs-log
    username: ${spring.db.username}
    password: ${spring.db.password}
    driver-class-name: com.mysql.cj.jdbc.Driver
seata:
  registry: # 注册中心的配置，微服务根据这些信息去注册中心获取TC服务地址
    type: nacos # 注册中心类型 nacos
    nacos:
      server-addr: 192.168.43.143:8848 # nacos地址
      namespace: "1"
      group: DEFAULT_GROUP
      application: seata-server # seata-server服务名称
      username: nacos
      password: nacos
  tx-service-group: rs #事务组名称
  service:
    vgroup-mapping: # 事务组与tc集群的映射关系
      rs: "default" # 事务组映射
  data-source-proxy-mode: AT # 开启数据源代理的AT模式
# MyBatis 配置
mybatis:
  mapper-locations: classpath:mapper/*.xml  # 扫描 resources/mapper 目录下的所有 XML 文件
  configuration:
    map-underscore-to-camel-case: true  # 开启下划线转驼峰
